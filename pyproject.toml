[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sessionhub"
version = "0.2.0"
description = "Encontra, monitora e retoma sessões de agentes de código (Claude Code, Codex, Gemini CLI, Aider, ...)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.79",
    "watchdog>=4.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
sessionhub = "sessionhub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sessionhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["sessionhub"]
warn_unused_ignores = true
disallow_untyped_defs = true
